<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wordle</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #121213;
    color: #fff;
    font-family: 'Clear Sans', 'Helvetica Neue', Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
  }

  header {
    width: 100%;
    max-width: 500px;
    border-bottom: 1px solid #3a3a3c;
    padding: 12px 0;
    text-align: center;
    position: relative;
  }

  h1 { font-size: 2rem; font-weight: 700; letter-spacing: 0.15rem; }

  #message {
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.9rem;
    font-weight: 700;
    color: #fff;
    margin: 12px 0 4px;
  }

  #board-container {
    display: flex;
    justify-content: center;
    align-items: center;
    flex-grow: 1;
    padding: 10px 0;
  }

  #board {
    display: grid;
    grid-template-rows: repeat(6, 1fr);
    gap: 5px;
    width: 330px;
    height: 396px;
  }

  .row {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 5px;
  }

  .tile {
    width: 100%;
    aspect-ratio: 1;
    border: 2px solid #3a3a3c;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2rem;
    font-weight: 700;
    text-transform: uppercase;
    transition: border-color 0.1s;
    user-select: none;
  }

  .tile[data-letter] { border-color: #565758; }

  .tile.reveal {
    animation: flip 0.5s ease forwards;
  }

  .tile.correct  { --bg: #538d4e; }
  .tile.present  { --bg: #b59f3b; }
  .tile.absent   { --bg: #3a3a3c; }

  .tile.pop { animation: pop 0.1s ease; }

  .tile.shake { animation: shake 0.5s ease; }

  @keyframes flip {
    0%   { transform: rotateX(0);    background: transparent; border-color: #565758; }
    49%  { transform: rotateX(90deg); background: transparent; }
    50%  { transform: rotateX(90deg); background: var(--bg); border-color: var(--bg); }
    100% { transform: rotateX(0);    background: var(--bg);  border-color: var(--bg); color: #fff; }
  }

  @keyframes pop {
    0%   { transform: scale(1); }
    50%  { transform: scale(1.12); }
    100% { transform: scale(1); }
  }

  @keyframes shake {
    0%,100% { transform: translateX(0); }
    20%     { transform: translateX(-6px); }
    40%     { transform: translateX(6px); }
    60%     { transform: translateX(-4px); }
    80%     { transform: translateX(4px); }
  }

  #keyboard {
    width: 100%;
    max-width: 500px;
    padding: 0 8px 20px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .kb-row {
    display: flex;
    justify-content: center;
    gap: 6px;
  }

  .key {
    height: 58px;
    min-width: 43px;
    border-radius: 4px;
    border: none;
    background: #818384;
    color: #fff;
    font-size: 0.85rem;
    font-weight: 700;
    cursor: pointer;
    text-transform: uppercase;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 6px;
    transition: background 0.2s;
    user-select: none;
  }

  .key.wide { min-width: 65px; font-size: 0.75rem; }
  .key.correct { background: #538d4e; }
  .key.present { background: #b59f3b; }
  .key.absent  { background: #3a3a3c; }

  #new-game-btn {
    margin-top: 6px;
    padding: 10px 24px;
    background: #538d4e;
    color: #fff;
    border: none;
    border-radius: 4px;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    display: none;
  }
  #new-game-btn:hover { background: #6aaf63; }
</style>
</head>
<body>

<header><h1>WORDLE</h1></header>

<div id="message"></div>
<button id="new-game-btn" onclick="initGame()">New Game</button>

<div id="board-container">
  <div id="board"></div>
</div>

<div id="keyboard"></div>

<script>

  "twirl","twist","ultra","under","unify","union","unite","unity","until","upper",
  "upset","urban","usage","users","usual","utter","valid","valor","value","vault",
  "video","vigil","vigor","viral","virus","visit","vital","vivid","voice","voter",
  "vague","wagon","waste","watch","water","weary","weave","wedge","weigh","weird",

  "wreck","write","wrong","yacht","yield","young","youth","zebra","zonal"

const VALID_GUESSES = new Set(WORDS);

let targetWord, currentRow, currentCol, board, gameOver, keyStates;

function initGame() {
  targetWord = WORDS[Math.floor(Math.random() * WORDS.length)].toUpperCase();
  currentRow = 0;
  currentCol = 0;
  gameOver = false;
  keyStates = {};

  document.getElementById('message').textContent = '';
  document.getElementById('new-game-btn').style.display = 'none';

  buildBoard();
  buildKeyboard();
}

function buildBoard() {
  const boardEl = document.getElementById('board');
  boardEl.innerHTML = '';
  board = [];
  for (let r = 0; r < 6; r++) {
    const row = document.createElement('div');
    row.className = 'row';
    const tiles = [];
    for (let c = 0; c < 5; c++) {
      const tile = document.createElement('div');
      tile.className = 'tile';
      row.appendChild(tile);
      tiles.push(tile);
    }
    boardEl.appendChild(row);
    board.push(tiles);
  }
}

function buildKeyboard() {
  const rows = [
    ['Q','W','E','R','T','Y','U','I','O','P'],
    ['A','S','D','F','G','H','J','K','L'],
    ['Enter','Z','X','C','V','B','N','M','⌫']
  ];
  const kbEl = document.getElementById('keyboard');
  kbEl.innerHTML = '';
  rows.forEach(keys => {
    const row = document.createElement('div');
    row.className = 'kb-row';
    keys.forEach(k => {
      const btn = document.createElement('button');
      btn.className = 'key' + (k.length > 1 ? ' wide' : '');
      btn.textContent = k;
      btn.dataset.key = k;
      btn.addEventListener('click', () => handleKey(k));
      row.appendChild(btn);
    });
    kbEl.appendChild(row);
  });
}

function handleKey(key) {
  if (gameOver) return;

  if (key === '⌫' || key === 'Backspace') {
    deleteLetter();
  } else if (key === 'Enter') {
    submitGuess();
  } else if (/^[A-Za-z]$/.test(key)) {
    addLetter(key.toUpperCase());
  }
}

function addLetter(letter) {
  if (currentCol >= 5) return;
  const tile = board[currentRow][currentCol];
  tile.textContent = letter;
  tile.dataset.letter = letter;
  tile.classList.add('pop');
  tile.addEventListener('animationend', () => tile.classList.remove('pop'), { once: true });
  currentCol++;
}

function deleteLetter() {
  if (currentCol <= 0) return;
  currentCol--;
  const tile = board[currentRow][currentCol];
  tile.textContent = '';
  delete tile.dataset.letter;
}

function submitGuess() {
  if (currentCol < 5) {
    showMessage('Not enough letters');
    shakeRow(currentRow);
    return;
  }

  const guess = board[currentRow].map(t => t.textContent).join('');

  if (!VALID_GUESSES.has(guess.toLowerCase())) {
    showMessage('Not in word list');
    shakeRow(currentRow);
    return;
  }

  const result = evaluate(guess);
  revealRow(currentRow, result, guess, () => {
    updateKeyboard(guess, result);

    if (result.every(r => r === 'correct')) {
      const msgs = ['Genius!', 'Magnificent!', 'Impressive!', 'Splendid!', 'Great!', 'Phew!'];
      showMessage(msgs[currentRow] || 'Nice!');
      gameOver = true;
      document.getElementById('new-game-btn').style.display = 'inline-block';
    } else if (currentRow === 5) {
      showMessage(targetWord);
      gameOver = true;
      document.getElementById('new-game-btn').style.display = 'inline-block';
    }
    currentRow++;
    currentCol = 0;
  });
}

function evaluate(guess) {
  const result = Array(5).fill('absent');
  const target = targetWord.split('');
  const guessArr = guess.split('');
  const used = Array(5).fill(false);

  // First pass: correct
  for (let i = 0; i < 5; i++) {
    if (guessArr[i] === target[i]) {
      result[i] = 'correct';
      used[i] = true;
      guessArr[i] = null;
    }
  }
  // Second pass: present
  for (let i = 0; i < 5; i++) {
    if (guessArr[i] === null) continue;
    for (let j = 0; j < 5; j++) {
      if (!used[j] && guessArr[i] === target[j]) {
        result[i] = 'present';
        used[j] = true;
        break;
      }
    }
  }
  return result;
}

function revealRow(row, result, guess, onDone) {
  const tiles = board[row];
  tiles.forEach((tile, i) => {
    setTimeout(() => {
      tile.classList.add('reveal', result[i]);
      if (i === 4) setTimeout(onDone, 500);
    }, i * 300);
  });
}

function shakeRow(row) {
  const tiles = board[row];
  tiles.forEach(tile => {
    tile.classList.add('shake');
    tile.addEventListener('animationend', () => tile.classList.remove('shake'), { once: true });
  });
}

function updateKeyboard(guess, result) {
  const priority = { correct: 3, present: 2, absent: 1 };
  guess.split('').forEach((letter, i) => {
    const cur = keyStates[letter];
    if (!cur || priority[result[i]] > priority[cur]) {
      keyStates[letter] = result[i];
    }
  });
  document.querySelectorAll('.key').forEach(btn => {
    const k = btn.dataset.key;
    if (keyStates[k]) {
      btn.className = 'key' + (k.length > 1 ? ' wide' : '') + ' ' + keyStates[k];
    }
  });
}

function showMessage(msg) {
  const el = document.getElementById('message');
  el.textContent = msg;
  if (msg && !gameOver) {
    setTimeout(() => { if (el.textContent === msg) el.textContent = ''; }, 1500);
  }
}

document.addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  handleKey(e.key === 'Backspace' ? 'Backspace' : e.key);
});

initGame();
</script>
